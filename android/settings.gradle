dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenLocal()
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/jcenter' }
        maven { url 'https://maven.aliyun.com/repository/google/' }
        maven { url 'https://maven.aliyun.com/repository/spring-plugin/' }
        maven { url 'https://maven.aliyun.com/repository/spring/' }
        maven { url 'https://maven.aliyun.com/repository/grails-core/' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin/' }
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
        maven { url 'https://maven.aliyun.com/repository/apache-snapshots/' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url "https://jitpack.io" }
        maven { url "https://plugins.gradle.org/m2/" }
        mavenCentral()
        google()
    }
}
rootProject.name = "android"

include ':core'
include ':compiler'
include ':runtime'
include ':movie-runtime'

include ':app'
include ':runtime-android'
include ':movie-runtime-android'
include ':tools'


project(':core').projectDir = new File('../jvm/core')
project(':compiler').projectDir = new File('../jvm/compiler')
project(':runtime').projectDir = new File('../jvm/runtime')
project(':movie-runtime').projectDir = new File('../jvm/movie-runtime')
project(':tools').projectDir = new File('../jvm/tools')