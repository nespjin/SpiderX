plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.nesp.fishplugin.sample.android"
        minSdk 26
        targetSdk 31
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/*.so']
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES.txt', 'META-INF/LICENSE.txt', 'META-INF/LICENSE.md', 'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/DEPENDENCIES', 'META-INF/notice.txt', 'META-INF/license.txt', 'META-INF/dependencies.txt', 'META-INF/LGPL2.1', 'META-INF/beans.xml', 'META-INF/LICENSE-notice.md', 'index-all.html', 'META-INF/org/apache/logging/log4j/core/config/plugins/Log4j2Plugins.dat', 'index.html', 'stylesheet.css', 'allclasses-frame.html', 'constant-values.html', 'overview-tree.html', 'Log4j-charsets.properties', 'build.properties', 'deprecated-list.html', 'allclasses-noframe.html', 'overview-summary.html', 'package-list', 'Log4j-levels.xsd', 'Log4j-events.dtd', 'Log4j-events.xsd', 'help-doc.html', 'serialized-form.html', 'Log4j-config.xsd', 'script.js', 'overview-frame.html']
        }
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    namespace 'com.nesp.fishplugin.sample.android'
}

dependencies {

    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.20.0'

    // implementation project(':movie-runtime-android')
    implementation project(path: ':core')
    implementation project(path: ':runtime')
    implementation project(path: ':runtime-android')
}